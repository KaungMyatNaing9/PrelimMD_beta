[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "prelimmd-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3",
  "python-multipart>=0.0.12,<1", "pydantic-settings>=2.5,<3", "pillow>=10.4,<12", "numpy>=2,<3",
  "opencv-python>=4.10,<5", "pytesseract>=0.3.13,<1", "pymupdf>=1.28,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1", "mypy>=1.11,<2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# FastAPI's `File`/`Form` defaults are the framework's documented endpoint signature.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disable_error_code = ["attr-defined", "arg-type", "call-overload"]
