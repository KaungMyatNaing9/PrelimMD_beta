name: checks
# Not on every push. This job failed on every push from 2026-09-13, when two scripts it
# called were deleted, until 2026-09-20 -- a week of failure mail that told nobody
# anything, and the mail is what people remember about a check. It now runs when somebody
# asks for it and on pull requests, where a red mark is read rather than filtered.
# Put `push:` back when the branch is shared with someone who will act on a red build.
on:
  pull_request:
  workflow_dispatch:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e './backend[dev]'
      # The two steps that stood here built a synthetic sample and verified a manifest with
      # scripts deleted on 2026-09-13, when the synthetic corpus was removed for reading
      # 96.9% while real clinic forms read 45%. This job has failed on every push since,
      # which is a notification nobody reads rather than a check anybody trusts.
      #
      # Tesseract is deliberately not installed: the one test that needs it skips itself,
      # so the suite stays a few seconds rather than a few minutes, and what needs OCR is
      # measured by the scripts in scripts/ against real forms, not here.
      - run: cd backend && pytest && ruff check app tests
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: cd frontend && npm ci && npm run typecheck && npm run build
